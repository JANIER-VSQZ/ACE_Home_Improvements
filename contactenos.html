<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="less/principal.less" />
    <script type="module" src="/menu.js"></script>
    <script type="module" src="./js/i18n.js"></script>
    <script type="module" src="./js/formulariosDemo.js"></script>
    <title data-i18n="paginas.contacto">Contáctanos</title>
</head>

<body>
    {{> header menu_9="true"}}

    <main class="contacto-main">
        <section class="contacto-contenedor">
            <div class="imagen-contacto">
                <img src="/images/casco.jpg" alt="Casco de construcción" data-i18n="[alt]contacto.imagen" />
            </div>

            <div class="formulario-contacto">
                <h2 data-i18n="contacto.dudas">¿Tienes dudas? ¡Escríbenos!</h2>
                {{> contactanos }}

                <div class="contacto-numeros">
                    <h3 data-i18n="contacto.numeros">Números de Contacto</h3>
                    <ul>
                        <li><a href="tel:+12019513723">201-951-3723</a></li>
                        <li><a href="tel:+19732884024">973-288-4024</a></li>
                        <li><a href="tel:+19733377454">973-337-7454</a></li>
                    </ul>
                    <p data-i18n="inicio.coberturaDescripcion">Trabajamos en Estados Unidos. Consulta disponibilidad para tu ubicación y el servicio que necesitas.</p>
                </div>
            </div>
        </section>
    </main>

    {{> footer }}
</body>

</html>
